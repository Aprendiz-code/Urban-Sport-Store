</style><style type="text/css" data-vite-dev-id="C:/Users/crist/OneDrive/Escritorio/Urban Sport Store/src/styles/globals.css">.promo-ribbon-bg {
  background: linear-gradient(90deg, #f59e0b 0%, #f97316 30%, #fb923c 60%, #f97316 100%);
  background-size: 200% 100%;
  animation: ribbonGradient 8s linear infinite;
}

.promo-ribbon-scroll {
  animation: ribbonMarquee 10s linear infinite;
}

.promo-ribbon-entry {
  opacity: 0;
  transform: translateY(-0.5rem);
  animation: promoRibbonFadeIn 700ms ease-out forwards;
}

@keyframes promoRibbonFadeIn {
  from {
    opacity: 0;
    transform: translateY(-0.5rem);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes promo-pulse {
  0%, 100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.82;
    transform: scale(1.01);
  }
}

@media (prefers-reduced-motion: reduce) {
  .promo-ribbon-entry,
  .promo-ribbon-entry button {
    animation: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
}

@keyframes ribbonMarquee {
  0% {
    transform: translateX(0%) skewX(-6deg);
  }
  100% {
    transform: translateX(-50%) skewX(-6deg);
  }
}

@keyframes ribbonPulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.93;
  }
}

@keyframes ribbonGradient {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

/* Animación sutil para llamar la atención sin ser intrusiva */
.promo-animate {
  transform-origin: center;
  animation: promo-bounce 1.8s ease-in-out infinite;
}

@keyframes promo-bounce {
  0%, 100% {
    transform: translateY(0px) scale(1);
  }
  30% {
    transform: translateY(-4px) scale(1.01);
  }
  55% {
    transform: translateY(0px) scale(1);
  }
  75% {
    transform: translateY(-2px) scale(1.005);
  }
}

@media (prefers-reduced-motion: reduce) {
  .promo-animate {
    animation: none !important;
    transform: none !important;
  }
}

.scrollbar-hide {
  -ms-overflow-style: none; /* IE and Edge */
  scrollbar-width: none; /* Firefox */
}

.scrollbar-hide::-webkit-scrollbar {
  display: none; /* Chrome, Safari, Opera */
}

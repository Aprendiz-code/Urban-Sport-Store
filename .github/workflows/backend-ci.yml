name: backend-ci

on:
  push:
    paths:
      - 'api/**'
      - 'lib/api-helpers/**'
      - 'lib/server/**'
      - 'src/lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vercel.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'lib/api-helpers/**'
      - 'lib/server/**'
      - 'src/lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vercel.json'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd api && npm ci
      - run: cd api && npm run lint
      - run: cd api && npm run typecheck
      - run: cd api && npm test
      - run: cd api && npm run build

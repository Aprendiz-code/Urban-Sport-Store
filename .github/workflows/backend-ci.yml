name: backend-ci

on:
  push:
    branches: [ main, master, cleanup/home-content-adapter ]
    paths:
      - 'api/**'
      - 'lib/api-helpers/**'
      - 'lib/server/**'
      - 'src/lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'vercel.json'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'lib/api-helpers/**'
      - 'lib/server/**'
      - 'src/lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'vercel.json'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci
        working-directory: api
      - run: npm run lint
        working-directory: api
      - run: npm run typecheck
        working-directory: api
      - run: npm test
        working-directory: api
      - run: npm run build
        working-directory: api
